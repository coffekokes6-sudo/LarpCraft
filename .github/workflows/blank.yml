name: Build LarpCraft APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find game files
        run: |
          if [ ! -f www/index.html ]; then
            for z in $(find . -maxdepth 2 -iname '*.zip'); do
              rm -rf _x && mkdir _x
              unzip -q -o "$z" -d _x || continue
              IDX=$(find _x -name index.html | head -n1)
              if [ -n "$IDX" ]; then
                mkdir -p www
                cp -r "$(dirname "$IDX")"/. www/
                break
              fi
            done
          fi
          if [ ! -f www/index.html ]; then
            echo "CHYBA: nenasiel som hru. Nahraj priecinok www/ (index.html + three.min.js) alebo ZIP s hrou do repozitara."
            exit 1
          fi
          ls -la www

      - name: Setup Capacitor
        run: |
          [ -f package.json ] || npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.larpcraft.game",
            "appName": "LarpCraft",
            "webDir": "www",
            "server": { "androidScheme": "http", "cleartext": true },
            "android": { "allowMixedContent": true }
          }
          EOF

      - name: Build Android app
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LarpCraft-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
